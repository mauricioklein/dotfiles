# ==============================================================================
# Herdr Configuration
# ==============================================================================
# Mirrors ~/.tmux.conf where an equivalent exists.
# Mapping: tmux session = workspace, tmux window = tab, tmux pane = pane.
# Reference: https://herdr.dev/docs/configuration/
# ==============================================================================

onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true
mouse_capture = true
confirm_close = true
prompt_new_tab_name = false  # tmux opens windows immediately; match that ergonomics
status_indicators = "symbols"

[ui.sidebar.spaces]
row_gap = 1

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", "agent"],
  [{ token = "tab", bold = true, dim = false }],
]

[ui.toast]
delivery = "system"

# -----------------------------------------------------------------------------
# Keybindings
# -----------------------------------------------------------------------------
[keys]
# Ctrl-Space: no collision with shell/readline typing.
# Requires disabling macOS "Select the previous input source" shortcut
# (System Settings → Keyboard → Keyboard Shortcuts → Input Sources).
prefix = "ctrl+space"

# Convention: lowercase letter = tab action, shift+letter = workspace action.
#   n / N → new tab    / new workspace
#   x / X → close tab  / close workspace
#   k / K → rename tab / rename workspace

# --- Workspace (= tmux session) ---
new_workspace      = "prefix+shift+n"
rename_workspace   = "prefix+shift+k"
close_workspace    = "prefix+shift+x"
previous_workspace = "alt+up"
next_workspace     = "alt+down"

# --- Tab (= tmux window) ---
new_tab      = "prefix+n"
rename_tab   = "prefix+k"
close_tab    = "prefix+x"
previous_tab = "shift+left"       # tmux: S-Left (non-prefix)
next_tab     = "shift+right"      # tmux: S-Right (non-prefix)

# --- Pane ---
split_vertical   = "prefix+\\"    # tmux: prefix+\
split_horizontal = "prefix+-"     # tmux: prefix+-
close_pane       = "prefix+ctrl+x"
# focus_pane_* bindings are GLOBAL in Herdr (not prefix-gated) — whatever key
# you bind here is intercepted everywhere, so plain h/j/k/l breaks normal typing
# and shift+h/j/k/l breaks uppercase typing. Use alt+letter (Herdr's documented
# example) since Alt+letter isn't part of normal typing.
focus_pane_left  = "alt+h"
focus_pane_down  = "alt+j"
focus_pane_up    = "alt+k"
focus_pane_right = "alt+l"
zoom             = "prefix+z"     # tmux: prefix+z (override Herdr default "f")
swap_pane_up     = ""              # disabled — conflicts with rename_workspace
resize_mode      = "prefix+shift+r"
rename_pane      = "prefix+p"

# --- Session / config ---
detach        = "prefix+d"        # tmux: prefix+d
reload_config = "prefix+r"        # tmux: prefix+r

# --- Herdr-only extras (no tmux equivalent) ---
toggle_sidebar           = "prefix+b"
edit_scrollback          = "prefix+e"    # open pane scrollback in $EDITOR
open_notification_target = "prefix+o"    # jump to the agent that requested attention
previous_agent           = "shift+up"
next_agent               = "shift+down"

# Numbered jumps:
#   prefix+1..9       → focus agent N
#   prefix+shift+1..9 → select workspace N
# (direct tab jumps unbound — use shift+left/right for prev/next tab)
focus_agent      = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
switch_tab       = ""

# Workspace picker — prefix+w opens the workspace menu for fuzzy search/switch.
workspace_picker = "prefix+w"

[ui.sound]
enabled = false
